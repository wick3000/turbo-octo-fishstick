<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Calculadora</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #f5f7ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #252b40 0, #10131c 58%);
    }
    .calculator {
      width: min(100%, 360px);
      padding: 22px;
      border: 1px solid #ffffff17;
      border-radius: 28px;
      background: #1a1e2bd9;
      box-shadow: 0 24px 80px #0008;
      backdrop-filter: blur(16px);
    }
    h1 { margin: 0 0 18px; font-size: 1rem; font-weight: 600; color: #aab2ca; }
    .display {
      min-height: 112px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 8px;
      padding: 14px 4px 20px;
      overflow: hidden;
    }
    #previous { min-height: 1.25em; color: #929ab1; font-size: 1rem; }
    #current { width: 100%; overflow: hidden; color: #fff; font-size: clamp(2.2rem, 12vw, 3.2rem); font-variant-numeric: tabular-nums; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button {
      min-height: 64px;
      border: 0;
      border-radius: 18px;
      background: #292e3e;
      color: #f5f7ff;
      font: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform .12s, background .12s;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { background: #363d52; }
    button:active { transform: scale(.95); }
    button:focus-visible { outline: 2px solid #9b8cff; outline-offset: 2px; }
    .utility { color: #c3bddf; background: #343148; }
    .operator { color: #c1b6ff; background: #302b4d; font-size: 1.45rem; }
    .operator[aria-pressed="true"] { background: #6654c7; color: white; }
    .equals { color: #fff; background: #795ef0; font-size: 1.5rem; }
    .equals:hover { background: #8a73f5; }
    .zero { grid-column: span 2; }
    .hint { margin: 16px 0 0; color: #858da5; font-size: .75rem; text-align: center; }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculadora">
    <h1>Calculadora</h1>
    <section class="display" aria-live="polite" aria-atomic="true" aria-label="Pantalla">
      <div id="previous"></div>
      <div id="current">0</div>
    </section>
    <div class="keys">
      <button class="utility" data-action="clear" aria-label="Borrar todo">AC</button>
      <button class="utility" data-action="sign" aria-label="Cambiar signo">±</button>
      <button class="utility" data-action="percent" aria-label="Porcentaje">%</button>
      <button class="operator" data-operator="÷" aria-label="Dividir">÷</button>

      <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
      <button class="operator" data-operator="×" aria-label="Multiplicar">×</button>

      <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
      <button class="operator" data-operator="−" aria-label="Restar">−</button>

      <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
      <button class="operator" data-operator="+" aria-label="Sumar">+</button>

      <button class="zero" data-digit="0">0</button><button data-action="decimal" aria-label="Decimal">.</button>
      <button class="equals" data-action="equals" aria-label="Igual">=</button>
    </div>
    <p class="hint">También puedes usar el teclado</p>
  </main>
  <script>
    (() => {
      const currentDisplay = document.querySelector('#current');
      const previousDisplay = document.querySelector('#previous');
      const operatorButtons = [...document.querySelectorAll('[data-operator]')];
      let current = '0';
      let previous = null;
      let operator = null;
      let replaceCurrent = false;

      const render = () => {
        currentDisplay.textContent = current;
        previousDisplay.textContent = previous !== null && operator ? `${previous} ${operator}` : '';
        operatorButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.operator === operator)));
      };

      const format = value => {
        if (!Number.isFinite(value)) return 'Error';
        const rounded = Number.parseFloat(value.toPrecision(11));
        return String(rounded).slice(0, 14);
      };

      const inputDigit = digit => {
        if (current === 'Error' || replaceCurrent) {
          current = digit;
          replaceCurrent = false;
        } else if (current.replace('-', '').length < 12) {
          current = current === '0' ? digit : current + digit;
        }
        render();
      };

      const calculate = () => {
        if (operator === null || previous === null) return;
        const left = Number(previous);
        const right = Number(current);
        let result;
        switch (operator) {
          case '+': result = left + right; break;
          case '−': result = left - right; break;
          case '×': result = left * right; break;
          case '÷': result = right === 0 ? NaN : left / right; break;
          default: return;
        }
        current = format(result);
        previous = null;
        operator = null;
        replaceCurrent = true;
        render();
      };

      document.querySelector('.keys').addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.digit !== undefined) return inputDigit(button.dataset.digit);
        if (button.dataset.operator) {
          if (operator && !replaceCurrent) calculate();
          previous = current;
          operator = button.dataset.operator;
          replaceCurrent = true;
          return render();
        }
        switch (button.dataset.action) {
          case 'clear': current = '0'; previous = null; operator = null; replaceCurrent = false; break;
          case 'decimal':
            if (current === 'Error' || replaceCurrent) { current = '0.'; replaceCurrent = false; }
            else if (!current.includes('.')) current += '.';
            break;
          case 'sign': if (current !== '0' && current !== 'Error') current = current.startsWith('-') ? current.slice(1) : `-${current}`; break;
          case 'percent': if (current !== 'Error') current = format(Number(current) / 100); break;
          case 'equals': calculate(); return;
        }
        render();
      });

      document.addEventListener('keydown', event => {
        if (/^[0-9]$/.test(event.key)) return inputDigit(event.key);
        if (event.key === '.' || event.key === ',') return document.querySelector('[data-action="decimal"]').click();
        if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); return document.querySelector('[data-action="equals"]').click(); }
        if (event.key === 'Escape' || event.key === 'Delete') return document.querySelector('[data-action="clear"]').click();
        const operators = { '+': '+', '-': '−', '*': '×', '/': '÷' };
        if (operators[event.key]) document.querySelector(`[data-operator="${operators[event.key]}"]`).click();
        if (event.key === '%') document.querySelector('[data-action="percent"]').click();
        if (event.key === 'Backspace') {
          current = current.length > 1 ? current.slice(0, -1) : '0';
          render();
        }
      });
    })();
  </script>
</body>
</html>
